components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    <<: *persistenceParameters
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A caller-generated, non-empty key (maximum 200 characters) used to safely retry this mutation.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional caller-generated retry key (1–200 characters). Replays the original completed mutation response.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    FamilyId:
      name: familyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NeedId:
      name: needId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    <<: *persistenceResponses
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing, invalid, or expired session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The record was changed by another staff member. Refresh and retry with its current version.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConflictResponse" }
    SimpleConflict:
      description: The requested account state conflicts with the current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    <<: *persistenceSchemas
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Role:
      type: string
      enum: [ADMIN, MANAGER, DELEGATE, SECURITY_OFFICER, SECURITY_MEMBER]
    StaffUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        passwordSet: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, email, name, role, active, passwordSet, createdAt, updatedAt]
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
      required: [email, password]
    CompleteCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        token: { type: string, minLength: 32, maxLength: 256 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Must contain uppercase, lowercase, number, and symbol characters.
      required: [token, password]
    CreateStaffRequest:
      type: object
      additionalProperties: false

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: AL-AQSA Camp persistent staff operations API
servers:
  - url: /api
    description: Base API path
tags:
  - { name: health, description: Health operations }
  - { name: auth, description: Authentication and sessions }
  - { name: staff, description: Administrative staff onboarding }
  - { name: dashboard, description: Dashboard operations }
  - { name: delegates, description: Delegate management }
  - { name: displaced, description: Displaced person management }
  - { name: aids, description: Aid distribution management }
  - { name: complaints, description: Complaint management }
  - { name: notifications, description: Notifications }
  - { name: security, description: Security task management }
  - { name: content, description: Camp content management }
  - { name: contact, description: Contact requests }
  - { name: people, description: Synchronized camp registry }
  - { name: tasks, description: Synchronized security tasks }
  - { name: camp-operations, description: "Family, shelter, and needs operations" }
paths:
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      responses:
        "200": { description: Current session, content: { application/json: { schema: { $ref: "#/components/schemas/SessionResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200": { description: Dashboard summary, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardSummary" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /delegates:
    get:
      operationId: listDelegates
      tags: [delegates]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Delegates, content: { application/json: { schema: { $ref: "#/components/schemas/DelegateList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDelegate
      tags: [delegates]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DelegateInput" } } } }
      responses:
        "201": { description: Delegate created, content: { application/json: { schema: { $ref: "#/components/schemas/Delegate" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /delegates/{id}:
    get:
      operationId: getDelegate
      tags: [delegates]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Delegate, content: { application/json: { schema: { $ref: "#/components/schemas/Delegate" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateDelegate
      tags: [delegates]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DelegateUpdate" } } } }
      responses:
        "200": { description: Delegate updated, content: { application/json: { schema: { $ref: "#/components/schemas/Delegate" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /displaced-persons:
    get:
      operationId: listDisplacedPersons
      tags: [displaced]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Displaced persons, content: { application/json: { schema: { $ref: "#/components/schemas/DisplacedPersonList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createDisplacedPerson
      tags: [displaced]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DisplacedPersonInput" } } } }
      responses:
        "201": { description: Person created, content: { application/json: { schema: { $ref: "#/components/schemas/DisplacedPerson" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /displaced-persons/{id}:
    get:
      operationId: getDisplacedPerson
      tags: [displaced]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Person, content: { application/json: { schema: { $ref: "#/components/schemas/DisplacedPerson" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateDisplacedPerson
      tags: [displaced]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DisplacedPersonUpdate" } } } }
      responses:
        "200": { description: Person updated, content: { application/json: { schema: { $ref: "#/components/schemas/DisplacedPerson" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /displaced-persons/{id}/delegate:
    patch:
      operationId: assignDisplacedPersonDelegate
      tags: [displaced]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DelegateAssignmentInput" } } } }
      responses:
        "200": { description: Delegate assigned, content: { application/json: { schema: { $ref: "#/components/schemas/DisplacedPerson" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /displaced-persons/{id}/aid-history:
    get:
      operationId: getDisplacedPersonAidHistory
      tags: [aids]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: status, in: query, schema: { type: string, enum: [assigned, received, cancelled] } }
      responses:
        "200": { description: Aid receipt history, content: { application/json: { schema: { $ref: "#/components/schemas/AidReceiptHistoryPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /aids:
    get:
      operationId: listManagedAids
      tags: [aids]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Aid campaigns, content: { application/json: { schema: { $ref: "#/components/schemas/AidList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createManagedAid
      tags: [aids]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AidInput" } } } }
      responses:
        "201": { description: Aid created, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedAid" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /aids/{id}:
    get:
      operationId: getAid
      tags: [aids]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Aid campaign, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedAid" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAid
      tags: [aids]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AidUpdate" } } } }
      responses:
        "200": { description: Aid updated, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedAid" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /aids/{id}/recipients:
    post:
      operationId: addAidRecipients
      tags: [aids]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AidRecipientsInput" } } } }
      responses:
        "200": { description: Recipients added, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedAid" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /aids/{id}/receive:
    post:
      operationId: receiveAid
      tags: [aids]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AidReceiptInput" } } } }
      responses:
        "200": { description: Receipt recorded, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /complaints:
    get:
      operationId: listManagedComplaints
      tags: [complaints]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Complaints, content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createComplaint
      tags: [complaints]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintInput" } } } }
      responses:
        "201": { description: Complaint created, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedComplaint" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /complaints/{id}/status:
    patch:
      operationId: updatePersistenceComplaintStatus
      tags: [complaints]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintStatusUpdate" } } } }
      responses:
        "200": { description: Status updated, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedComplaint" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /complaints/{id}/reply:
    post:
      operationId: replyToComplaint
      tags: [complaints]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintReplyInput" } } } }
      responses:
        "200": { description: Reply added, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedComplaint" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Notifications, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationReadUpdate" } } } }
      responses:
        "200": { description: Notification updated, content: { application/json: { schema: { $ref: "#/components/schemas/Notification" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /security-tasks:
    get:
      operationId: listSecurityTasks
      tags: [security]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Security tasks, content: { application/json: { schema: { $ref: "#/components/schemas/SecurityTaskList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createSecurityTask
      tags: [security]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SecurityTaskInput" } } } }
      responses:
        "201": { description: Task created, content: { application/json: { schema: { $ref: "#/components/schemas/SecurityTask" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /security-tasks/{id}:
    patch:
      operationId: updateSecurityTask
      tags: [security]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SecurityTaskUpdate" } } } }
      responses:
        "200": { description: Task updated, content: { application/json: { schema: { $ref: "#/components/schemas/SecurityTask" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /content:
    get:
      operationId: listContent
      tags: [content]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Content posts, content: { application/json: { schema: { $ref: "#/components/schemas/ContentPostList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createContentPost
      tags: [content]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentPostInput" } } } }
      responses:
        "201": { description: Post created, content: { application/json: { schema: { $ref: "#/components/schemas/ContentPost" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /content/{id}:
    get:
      operationId: getContentPost
      tags: [content]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Content post, content: { application/json: { schema: { $ref: "#/components/schemas/ContentPost" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateContentPost
      tags: [content]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentPostUpdate" } } } }
      responses:
        "200": { description: Post updated, content: { application/json: { schema: { $ref: "#/components/schemas/ContentPost" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /contact-requests:
    post:
      operationId: createContactRequest
      tags: [contact]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContactRequestInput" } } } }
      responses:
        "201": { description: Request received, content: { application/json: { schema: { $ref: "#/components/schemas/ContactRequest" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  # Task 7 synchronized operational API
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a staff session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the authenticated staff member
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/complete-credential:
    post:
      operationId: completeCredential
      tags: [auth]
      summary: Set a password using a one-time invite or reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteCredentialRequest" }
      responses:
        "204": { description: Password set and all existing sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff accounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Staff accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createStaff
      tags: [staff]
      summary: Create an inactive staff account and one-time invite
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStaffRequest" }
      responses:
        "201":
          description: Staff account and one-time invite created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateStaffResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SimpleConflict" }
  /staff/{staffId}:
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Update role, name, or active state
      security: [{ bearerAuth: [] }]
      parameters:
        - name: staffId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStaffRequest" }
      responses:
        "200":
          description: Updated staff account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SimpleConflict" }
  /staff/{staffId}/invite:
    post:
      operationId: renewStaffInvite
      tags: [staff]
      summary: Replace the invite for a pending staff account
      security: [{ bearerAuth: [] }]
      parameters:
        - name: staffId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Replacement one-time invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SimpleConflict" }
  /staff/{staffId}/password-reset:
    post:
      operationId: issueStaffPasswordReset
      tags: [staff]
      summary: Issue a replacement password-reset token for an eligible staff account
      security: [{ bearerAuth: [] }]
      parameters:
        - name: staffId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One-time password-reset token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetTokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SimpleConflict" }
  /sync/aids:
    get:
      operationId: listAids
      tags: [aids]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Aid distributions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Aid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createAid
      tags: [aids]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAidRequest" }
      responses:
        "201":
          description: Aid created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Aid" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sync/aids/{aidId}:
    patch:
      operationId: updateSyncAid
      tags: [aids]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: aidId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AidUpdate" }
      responses:
        "200": { description: Updated aid, content: { application/json: { schema: { $ref: "#/components/schemas/Aid" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

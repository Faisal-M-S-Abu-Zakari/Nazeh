x-persistence-components: &persistenceComponents
  parameters: &persistenceParameters
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses: &persistenceResponses
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    Forbidden: { description: Insufficient permissions, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  schemas: &persistenceSchemas
    HealthStatus:
      type: object
      required: [status]
      properties: { status: { type: string } }
    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, manager, delegate, displaced, security] }
        phone: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    SessionResponse:
      type: object
      required: [user, token, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        token: { type: string }
        expiresAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [totalDelegates, totalDisplacedPersons, activeAids, openComplaints, unreadNotifications]
      properties:
        totalDelegates: { type: integer }
        totalDisplacedPersons: { type: integer }
        activeAids: { type: integer }
        openComplaints: { type: integer }
        unreadNotifications: { type: integer }
    Delegate:
      type: object
      required: [id, name, email, phone, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        area: { type: [string, "null"] }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
